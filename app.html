<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNCF Retard Mobile</title>
  <style>
    :root {
      --bg: #f7f6f2;
      --card: #ffffff;
      --text: #222;
      --muted: #666;
      --ok: #2e7d32;
      --warn: #d97a00;
      --err: #b3261e;
      --border: #ddd8cf;
      --accent: #01696f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.3rem;
      margin: 0 0 12px;
    }

    .status {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .err { color: var(--err); }

    .row {
      margin: 8px 0;
      line-height: 1.5;
    }

    .muted {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .label {
      font-weight: 600;
    }

    button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      padding: 12px;
    }

    button:active {
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1 id="gare">Toulouse Matabiau</h1>
      <div id="status" class="status">Chargement…</div>
      <div id="message" class="row"></div>
      <div id="details" class="muted"></div>
    </section>

    <section class="card">
      <button id="refreshBtn">Rafraîchir l’affichage</button>
    </section>
  </main>

  <script>
    function formatDetails(data) {
      const train = data.train || {};
      const service = data.service || {};

      return [
        `Train: ${train.numero || "-"}`,
        `Origine: ${train.origine || "-"}`,
        `Destination: ${train.destination || "-"}`,
        `Prévu: ${train.heurePrevue || "-"}`,
        `Estimé: ${train.heureEstimee || "-"}`,
        `Voie: ${train.voie || "-"}`,
        `Prise de service: ${service.heureCorrigee || service.heureTheorique || "-"}`,
        `Mise à jour: ${data.updatedAt || "-"}`
      ].join(" · ");
    }

    async function loadStatus() {
      const statusEl = document.getElementById("status");
      const messageEl = document.getElementById("message");
      const detailsEl = document.getElementById("details");
      const gareEl = document.getElementById("gare");

      try {
        const res = await fetch("./data/status.json?v=" + Date.now());

        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        const data = await res.json();

        gareEl.textContent = data.gare || "Gare non définie";
        statusEl.className = "status";

        if (data.statutCode === "ok") {
          statusEl.textContent = data.statut || "Service maintenu";
          statusEl.classList.add("ok");
        } else if (data.statutCode === "delay") {
          statusEl.textContent = data.statut || "Retard détecté";
          statusEl.classList.add("warn");
        } else {
          statusEl.textContent = data.statut || "Statut incertain";
          statusEl.classList.add("err");
        }

        messageEl.textContent = data.message || "Aucun message";
        detailsEl.textContent = formatDetails(data);
      } catch (error) {
        statusEl.textContent = "Erreur de lecture";
        statusEl.className = "status err";
        messageEl.textContent = "Impossible de charger le statut.";
        detailsEl.textContent = "Vérifie la présence et le format de data/status.json.";
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadStatus);
    loadStatus();
  </script>
</body>
</html>
