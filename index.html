<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yaduretard</title>
  <style>
    :root{
      --bg:#f5f1eb;
      --card:#fff;
      --text:#1f2937;
      --muted:#6b7280;
      --accent:#0f766e;
      --accent-dark:#115e59;
      --border:#e5e7eb;
      --shadow:0 10px 30px rgba(17,24,39,.08);
      --success-bg:#e6f4ef;
      --success-text:#0f766e;
      --danger-bg:#fef2f2;
      --danger-text:#b91c1c
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:linear-gradient(180deg,var(--bg),#fff 60%);
      color:var(--text);
      min-height:100vh
    }
    .wrap{
      width:min(100%,560px);
      margin:0 auto;
      padding:18px 14px 28px
    }
    .header{margin-bottom:14px}
    .title{
      margin:0;
      font-size:1.6rem;
      font-weight:900;
      line-height:1.2
    }
    .subtitle{
      margin:4px 0 0;
      color:var(--muted)
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:18px
    }
    .station{
      margin:0 0 8px;
      font-size:1.2rem;
      font-weight:800
    }
    .status{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      font-weight:700;
      margin:0 0 14px;
      background:var(--success-bg);
      color:var(--success-text)
    }
    .status::before{
      content:'';
      width:9px;
      height:9px;
      border-radius:50%;
      background:currentColor;
      box-shadow:0 0 0 4px rgba(15,118,110,.12)
    }
    .status.err{
      background:var(--danger-bg);
      color:var(--danger-text)
    }
    .status.err::before{
      box-shadow:0 0 0 4px rgba(185,28,28,.12)
    }
    .message{
      margin:0 0 16px;
      line-height:1.5
    }
    .grid{
      display:grid;
      gap:10px
    }
    .row{
      display:grid;
      grid-template-columns:1fr;
      gap:4px;
      padding:12px 14px;
      border:1px solid var(--border);
      border-radius:14px;
      background:#fcfcfc
    }
    .label{
      font-size:.78rem;
      letter-spacing:.06em;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:700
    }
    .value{
      font-size:1rem;
      word-break:break-word
    }
    .actions{
      display:grid;
      gap:10px;
      margin-top:12px
    }
    button{
      border:0;
      border-radius:14px;
      padding:14px 16px;
      font-size:1rem;
      font-weight:800;
      cursor:pointer
    }
    .primary{
      background:var(--accent);
      color:#fff
    }
    .primary:hover{
      background:var(--accent-dark)
    }
    .secondary{
      background:#eef2f7;
      color:var(--text)
    }
    .footer{
      margin-top:12px;
      text-align:center;
      color:var(--muted);
      font-size:.85rem
    }
    @media (min-width:520px){
      .row{
        grid-template-columns:150px 1fr;
        align-items:start
      }
      .label{padding-top:2px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1 class="title">Yaduretard</h1>
      <p class="subtitle">Affichage temps réel du dernier train surveillé.</p>
    </header>

    <section class="card">
      <h2 class="station" id="stationName">Chargement…</h2>
      <div class="status" id="serviceStatus">Lecture des données</div>
      <p class="message" id="messageText">Récupération du flux en cours.</p>

      <div class="grid">
        <div class="row"><div class="label">Train</div><div class="value" id="trainValue">—</div></div>
        <div class="row"><div class="label">Origine</div><div class="value" id="originValue">—</div></div>
        <div class="row"><div class="label">Destination</div><div class="value" id="destinationValue">—</div></div>
        <div class="row"><div class="label">Prévu</div><div class="value" id="plannedValue">—</div></div>
        <div class="row"><div class="label">Estimé</div><div class="value" id="estimatedValue">—</div></div>
        <div class="row"><div class="label">Voie</div><div class="value" id="trackValue">—</div></div>
        <div class="row"><div class="label">Mise à jour</div><div class="value" id="updateValue">—</div></div>
      </div>

      <div class="actions">
        <button class="primary" id="refreshBtn">Rafraîchir l’affichage</button>
        <button class="secondary" id="copyBtn">Copier les infos</button>
      </div>
    </section>

    <div class="footer" id="footerText">En attente du flux…</div>
  </main>

  <script>
    const DATA_URL = './data.json';
    const el = id => document.getElementById(id);
    let current = null;

    const map = {
      stationName: ['stationName','gare','station'],
      serviceStatus: ['serviceStatus','statut','status'],
      messageText: ['messageText','message','details'],
      trainValue: ['trainValue','train','numTrain','trainNumber'],
      originValue: ['originValue','origin','origine'],
      destinationValue: ['destinationValue','destination','dest'],
      plannedValue: ['plannedValue','prevu','planned'],
      estimatedValue: ['estimatedValue','estime','estimated'],
      trackValue: ['trackValue','voie','platform'],
      updateValue: ['updateValue','miseAJour','updatedAt','lastUpdate']
    };

    function pick(o, keys, fallback='—') {
      for (const k of keys) {
        const v = o && o[k];
        if (v !== undefined && v !== null && String(v).trim() !== '') return String(v);
      }
      return fallback;
    }

    function setStatus(text, err=false) {
      const s = el('serviceStatus');
      s.className = 'status' + (err ? ' err' : '');
      s.textContent = text;
    }

    function render(obj) {
      current = {};
      for (const [field, keys] of Object.entries(map)) {
        current[field] = pick(obj, keys, field === 'updateValue' ? new Date().toLocaleString('fr-FR') : '—');
      }
      el('stationName').textContent = current.stationName;
      el('messageText').textContent = current.messageText;
      el('trainValue').textContent = current.trainValue;
      el('originValue').textContent = current.originValue;
      el('destinationValue').textContent = current.destinationValue;
      el('plannedValue').textContent = current.plannedValue;
      el('estimatedValue').textContent = current.estimatedValue;
      el('trackValue').textContent = current.trackValue;
      el('updateValue').textContent = current.updateValue;
      el('footerText').textContent = 'Dernière actualisation : ' + new Date().toLocaleTimeString('fr-FR');
      setStatus(current.serviceStatus, false);
    }

    async function loadData() {
      setStatus('Lecture des données');
      el('messageText').textContent = 'Récupération du flux en cours.';
      try {
        const r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
        const txt = await r.text();
        if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + txt.slice(0, 120));
        const obj = JSON.parse(txt);
        render(obj);
      } catch (e) {
        el('stationName').textContent = 'Impossible de charger';
        el('messageText').textContent = 'Vérifie que data.json existe à la racine et contient du JSON valide.';
        ['trainValue','originValue','destinationValue','plannedValue','estimatedValue','trackValue'].forEach(id => el(id).textContent = '—');
        el('updateValue').textContent = new Date().toLocaleString('fr-FR');
        setStatus('Flux indisponible', true);
      }
    }

    el('refreshBtn').onclick = loadData;

    el('copyBtn').onclick = async () => {
      if (!current) return;
      const text = Object.entries(current).map(([k,v]) => `${k}: ${v}`).join('
');
      try {
        await navigator.clipboard.writeText(text);
        const b = el('copyBtn');
        const old = b.textContent;
        b.textContent = 'Copié !';
        setTimeout(() => b.textContent = old, 1000);
      } catch {}
    };

    loadData();
    setInterval(loadData, 15000);
  </script>
</body>
</html>
