<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Pages</title>
<style>
body{font-family:system-ui;margin:0;padding:24px;background:#f5f1eb;color:#1f2937}
.box{max-width:560px;margin:0 auto;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#fff;padding:14px;border-radius:12px;overflow:auto}
</style>
</head>
<body>
  <div class="box">
    <h1>TEST INDEX</h1>
    <p>Si tu vois cette page, <strong>index.html</strong> est bien chargé.</p>
    <p>JSON lu :</p>
    <pre id="out">chargement…</pre>
  </div>
  <script>
    fetch('./data.json?t=' + Date.now(), {cache:'no-store'})
      .then(r => r.text())
      .then(t => document.getElementById('out').textContent = t)
      .catch(e => document.getElementById('out').textContent = 'ERREUR: ' + e.message);
  </script>
</body>
</html>
