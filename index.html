<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaduretard</title>
<style>
body{font-family:system-ui;margin:0;padding:18px;background:#f5f1eb;color:#1f2937}.wrap{max-width:560px;margin:0 auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}.status{display:inline-block;padding:8px 12px;border-radius:999px;background:#e6f4ef;color:#0f766e;font-weight:700}.row{border:1px solid #e5e7eb;border-radius:14px;padding:12px 14px;margin-top:10px;background:#fcfcfc}.label{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;font-weight:700}.value{font-size:1rem}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:1rem;font-weight:800;margin-top:10px}.primary{background:#0f766e;color:#fff}.secondary{background:#eef2f7;color:#1f2937}.err{background:#fef2f2;color:#b91c1c}.small{font-size:.85rem;color:#6b7280;margin-top:10px}.debug{white-space:pre-wrap;background:#111827;color:#fff;padding:12px;border-radius:12px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Yaduretard</h1>
  <p>Affichage temps réel du dernier train surveillé.</p>
  <div class="card">
    <div class="status" id="serviceStatus">Lecture des données</div>
    <p id="messageText">Récupération du flux en cours.</p>
    <div class="row"><div class="label">Station</div><div class="value" id="stationName">Chargement…</div></div>
    <div class="row"><div class="label">Train</div><div class="value" id="trainValue">—</div></div>
    <div class="row"><div class="label">Origine</div><div class="value" id="originValue">—</div></div>
    <div class="row"><div class="label">Destination</div><div class="value" id="destinationValue">—</div></div>
    <div class="row"><div class="label">Prévu</div><div class="value" id="plannedValue">—</div></div>
    <div class="row"><div class="label">Estimé</div><div class="value" id="estimatedValue">—</div></div>
    <div class="row"><div class="label">Voie</div><div class="value" id="trackValue">—</div></div>
    <div class="row"><div class="label">Mise à jour</div><div class="value" id="updateValue">—</div></div>
    <button class="btn primary" id="refreshBtn">Rafraîchir l’affichage</button>
    <button class="btn secondary" id="copyBtn">Copier les infos</button>
    <div class="small" id="sourceLine">Source : ./data.json</div>
    <div class="debug" id="debugBox" style="display:none"></div>
  </div>
</div>
<script>
const el=id=>document.getElementById(id);
const DATA_URL='./data.json';
let current=null;
function pick(o, keys, fb='—'){for(const k of keys){const v=o&&o[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')return String(v)}return fb}
async function loadData(){
  try{
    el('serviceStatus').className='status';
    el('serviceStatus').textContent='Lecture des données';
    el('messageText').textContent='Récupération du flux en cours.';
    const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});
    const txt=await r.text();
    if(!r.ok) throw new Error('HTTP '+r.status+': '+txt.slice(0,120));
    const o=JSON.parse(txt);
    current={
      stationName:pick(o,['stationName','gare','station']),
      serviceStatus:pick(o,['serviceStatus','statut','status']),
      messageText:pick(o,['messageText','message','details']),
      trainValue:pick(o,['trainValue','train','numTrain','trainNumber']),
      originValue:pick(o,['originValue','origin','origine']),
      destinationValue:pick(o,['destinationValue','destination','dest']),
      plannedValue:pick(o,['plannedValue','prevu','planned']),
      estimatedValue:pick(o,['estimatedValue','estime','estimated']),
      trackValue:pick(o,['trackValue','voie','platform']),
      updateValue:pick(o,['updateValue','miseAJour','updatedAt','lastUpdate'],new Date().toLocaleString('fr-FR'))
    };
    stationName.textContent=current.stationName;messageText.textContent=current.messageText;trainValue.textContent=current.trainValue;originValue.textContent=current.originValue;destinationValue.textContent=current.destinationValue;plannedValue.textContent=current.plannedValue;estimatedValue.textContent=current.estimatedValue;trackValue.textContent=current.trackValue;updateValue.textContent=current.updateValue;sourceLine.textContent='Source : '+DATA_URL;debugBox.textContent=JSON.stringify(o,null,2);debugBox.style.display='none';serviceStatus.textContent=current.serviceStatus;serviceStatus.className='status';
  }catch(e){
    stationName.textContent='Impossible de charger';messageText.textContent='Vérifie que data.json existe à la racine et contient du JSON valide.';['trainValue','originValue','destinationValue','plannedValue','estimatedValue','trackValue'].forEach(id=>el(id).textContent='—');updateValue.textContent=new Date().toLocaleString('fr-FR');serviceStatus.textContent='Flux indisponible';serviceStatus.className='status err';debugBox.style.display='block';debugBox.textContent=String(e&&e.message?e.message:e);
  }
}
refreshBtn.onclick=loadData;copyBtn.onclick=async()=>{if(!current)return;await navigator.clipboard.writeText(Object.entries(current).map(([k,v])=>`${k}: ${v}`).join('
'))};loadData();setInterval(loadData,15000);
</script>
</body>
</html>
