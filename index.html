<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaduretard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 18px; background: #f5f1eb; color: #1f2937; }
    .wrap { max-width: 560px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 18px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    .status { display: inline-block; padding: 8px 12px; border-radius: 999px; background: #e6f4ef; color: #0f766e; font-weight: 700; }
    .row { border: 1px solid #e5e7eb; border-radius: 14px; padding: 12px 14px; margin-top: 10px; background: #fcfcfc; }
    .label { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: #6b7280; font-weight: 700; }
    .value { font-size: 1rem; min-height: 1.25em; }
    .btn { width: 100%; border: 0; border-radius: 14px; padding: 14px 16px; font-size: 1rem; font-weight: 800; margin-top: 10px; cursor: pointer; }
    .primary { background: #0f766e; color: #fff; }
    .secondary { background: #eef2f7; color: #1f2937; }
    .small { font-size: .85rem; color: #6b7280; margin-top: 10px; }
    .err { background: #fef2f2; color: #b91c1c; }
    .debug { display: none; white-space: pre-wrap; background: #111827; color: #fff; padding: 12px; border-radius: 12px; margin-top: 12px; overflow: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Yaduretard</h1>
    <p>Affichage temps réel du dernier train surveillé.</p>
    <div class="card">
      <div class="status" id="serviceStatus">Lecture des données</div>
      <p id="messageText">Connexion au flux SNCF.</p>
      <div class="row"><div class="label">Station</div><div class="value" id="stationName">Chargement…</div></div>
      <div class="row"><div class="label">Train</div><div class="value" id="trainValue">—</div></div>
      <div class="row"><div class="label">Origine</div><div class="value" id="originValue">—</div></div>
      <div class="row"><div class="label">Destination</div><div class="value" id="destinationValue">—</div></div>
      <div class="row"><div class="label">Prévu</div><div class="value" id="plannedValue">—</div></div>
      <div class="row"><div class="label">Estimé</div><div class="value" id="estimatedValue">—</div></div>
      <div class="row"><div class="label">Voie</div><div class="value" id="trackValue">—</div></div>
      <div class="row"><div class="label">Mise à jour</div><div class="value" id="updateValue">—</div></div>
      <button class="btn primary" id="refreshBtn">Rafraîchir l’affichage</button>
      <button class="btn secondary" id="copyBtn">Copier les infos</button>
      <div class="small" id="sourceLine">Source : API SNCF</div>
      <div class="debug" id="debugBox"></div>
    </div>
  </div>

  <script>
    const apiUrl = 'sncf_api_response.json';
    let current = null;

    function pick(o, keys, fallback='—') {
      for (const k of keys) {
        if (o && o[k] != null && o[k] !== '') return o[k];
      }
      return fallback;
    }

    function normalize(o) {
      return {
        stationName: pick(o, ['stationName','station','gare','stop_name','name'], 'Chargement…'),
        serviceStatus: pick(o, ['serviceStatus','statut','status'], 'Lecture des données'),
        messageText: pick(o, ['messageText','message','details','info'], 'Connexion au flux SNCF.'),
        trainValue: pick(o, ['trainValue','train','numTrain','trainNumber','trip_id'], '—'),
        originValue: pick(o, ['originValue','origin','origine','from'], '—'),
        destinationValue: pick(o, ['destinationValue','destination','dest','to'], '—'),
        plannedValue: pick(o, ['plannedValue','prevu','planned','scheduled'], '—'),
        estimatedValue: pick(o, ['estimatedValue','estime','estimated','expected'], '—'),
        trackValue: pick(o, ['trackValue','voie','platform','track'], '—'),
        updateValue: pick(o, ['updateValue','miseAJour','updatedAt','lastUpdate'], new Date().toLocaleString('fr-FR'))
      };
    }

    async function fetchJson(url) {
      const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return JSON.parse(await r.text());
    }

    async function tryLoad() {
      try {
        const data = await fetchJson(apiUrl);
        const o = normalize(data);
        current = o;
        stationName.textContent = o.stationName;
        serviceStatus.textContent = o.serviceStatus;
        serviceStatus.className = 'status';
        messageText.textContent = o.messageText;
        trainValue.textContent = o.trainValue;
        originValue.textContent = o.originValue;
        destinationValue.textContent = o.destinationValue;
        plannedValue.textContent = o.plannedValue;
        estimatedValue.textContent = o.estimatedValue;
        trackValue.textContent = o.trackValue;
        updateValue.textContent = o.updateValue;
        sourceLine.textContent = 'Source : ' + apiUrl;
        debugBox.style.display = 'none';
      } catch (e) {
        stationName.textContent = 'API non chargée';
        serviceStatus.textContent = 'Flux indisponible';
        serviceStatus.className = 'status err';
        messageText.textContent = 'Le fichier sncf_api_response.json est absent ou invalide.';
        debugBox.style.display = 'block';
        debugBox.textContent = String(e && e.message ? e.message : e);
      }
    }

    refreshBtn.onclick = tryLoad;
    copyBtn.onclick = async () => {
      if (!current) return;
      await navigator.clipboard.writeText(Object.entries(current).map(([k, v]) => `${k}: ${v}`).join('
'));
    };

    tryLoad();
  </script>
</body>
</html>
