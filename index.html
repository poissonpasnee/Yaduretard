<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yaduretard</title>
  <style>
    :root{--bg:#f5f1eb;--card:#fff;--text:#1f2937;--muted:#6b7280;--accent:#0f766e;--accent2:#115e59;--border:#e5e7eb;--shadow:0 10px 30px rgba(17,24,39,.08);--okbg:#e6f4ef;--oktxt:#0f766e;--errbg:#fef2f2;--errtxt:#b91c1c}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(180deg,var(--bg),#fff 60%);color:var(--text);min-height:100vh}
    .wrap{width:min(100%,560px);margin:0 auto;padding:18px 14px 30px}.title{margin:0;font-size:1.6rem;font-weight:900}.subtitle{margin:4px 0 0;color:var(--muted)}.card{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px}.station{margin:0 0 8px;font-size:1.2rem;font-weight:800}.status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;font-weight:700;margin:0 0 14px;background:var(--okbg);color:var(--oktxt)}.status::before{content:'';width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px rgba(15,118,110,.12)}.status.err{background:var(--errbg);color:var(--errtxt)}.status.err::before{box-shadow:0 0 0 4px rgba(185,28,28,.12)}.message{margin:0 0 16px;line-height:1.5}.grid{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr;gap:4px;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:#fcfcfc}.label{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}.value{font-size:1rem;word-break:break-word}.actions{display:grid;gap:10px;margin-top:12px}button{border:0;border-radius:14px;padding:14px 16px;font-size:1rem;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f7;color:var(--text)}.footer{margin-top:12px;text-align:center;color:var(--muted);font-size:.85rem}.small{margin-top:10px;font-size:.85rem;color:var(--muted);word-break:break-word}.debug{margin-top:12px;padding:10px 12px;border-radius:12px;background:#111827;color:#fff;font-size:.82rem;white-space:pre-wrap;display:none}.showdebug .debug{display:block}@media (min-width:520px){.row{grid-template-columns:150px 1fr;align-items:start}.label{padding-top:2px}}
  </style>
</head>
<body>
  <main class="wrap" id="app">
    <h1 class="title">Yaduretard</h1>
    <p class="subtitle">Affichage temps réel du dernier train surveillé.</p>

    <section class="card">
      <h2 class="station" id="stationName">Chargement…</h2>
      <div class="status" id="serviceStatus">Lecture des données</div>
      <p class="message" id="messageText">Récupération du flux en cours.</p>

      <div class="grid">
        <div class="row"><div class="label">Train</div><div class="value" id="trainValue">—</div></div>
        <div class="row"><div class="label">Origine</div><div class="value" id="originValue">—</div></div>
        <div class="row"><div class="label">Destination</div><div class="value" id="destinationValue">—</div></div>
        <div class="row"><div class="label">Prévu</div><div class="value" id="plannedValue">—</div></div>
        <div class="row"><div class="label">Estimé</div><div class="value" id="estimatedValue">—</div></div>
        <div class="row"><div class="label">Voie</div><div class="value" id="trackValue">—</div></div>
        <div class="row"><div class="label">Mise à jour</div><div class="value" id="updateValue">—</div></div>
      </div>

      <div class="actions">
        <button class="primary" id="refreshBtn">Rafraîchir l’affichage</button>
        <button class="secondary" id="copyBtn">Copier les infos</button>
      </div>

      <div class="small" id="sourceLine">Source : ./data.json</div>
      <div class="debug" id="debugBox"></div>
    </section>

    <div class="footer" id="footerText">En attente du flux…</div>
  </main>

  <script>
    const DATA_URL = './data.json';
    const ids = ['stationName','serviceStatus','messageText','trainValue','originValue','destinationValue','plannedValue','estimatedValue','trackValue','updateValue','footerText','debugBox','sourceLine','app'];
    const el = Object.fromEntries(ids.map(i => [i, document.getElementById(i)]));
    let current = null;

    function setError(msg) {
      el.serviceStatus.textContent = 'Flux indisponible';
      el.serviceStatus.classList.add('err');
      el.messageText.textContent = msg;
    }

    function setOk(statusText) {
      el.serviceStatus.classList.remove('err');
      el.serviceStatus.textContent = statusText || 'OK';
    }

    function pick(obj, keys, fallback='—') {
      for (const k of keys) {
        const v = obj?.[k];
        if (v !== undefined && v !== null && String(v).trim() !== '') return String(v);
      }
      return fallback;
    }

    function render(obj) {
      const d = {
        stationName: pick(obj, ['stationName','gare','station','title'], '—'),
        serviceStatus: pick(obj, ['serviceStatus','statut','status'], '—'),
        messageText: pick(obj, ['messageText','message','details','text'], '—'),
        trainValue: pick(obj, ['trainValue','train','numTrain','trainNumber'], '—'),
        originValue: pick(obj, ['originValue','origin','origine'], '—'),
        destinationValue: pick(obj, ['destinationValue','destination','destinatione'], '—'),
        plannedValue: pick(obj, ['plannedValue','prevu','planned'], '—'),
        estimatedValue: pick(obj, ['estimatedValue','estime','estimated'], '—'),
        trackValue: pick(obj, ['trackValue','voie','platform'], '—'),
        updateValue: pick(obj, ['updateValue','miseAJour','updatedAt','lastUpdate'], new Date().toLocaleString('fr-FR'))
      };
      current = d;
      el.stationName.textContent = d.stationName;
      setOk(d.serviceStatus);
      el.messageText.textContent = d.messageText;
      el.trainValue.textContent = d.trainValue;
      el.originValue.textContent = d.originValue;
      el.destinationValue.textContent = d.destinationValue;
      el.plannedValue.textContent = d.plannedValue;
      el.estimatedValue.textContent = d.estimatedValue;
      el.trackValue.textContent = d.trackValue;
      el.updateValue.textContent = d.updateValue;
      el.footerText.textContent = 'Dernière actualisation : ' + new Date().toLocaleTimeString('fr-FR');
      el.debugBox.textContent = JSON.stringify(obj, null, 2);
    }

    async function loadData() {
      setOk('Lecture des données');
      el.messageText.textContent = 'Récupération du flux en cours.';
      try {
        const res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
        const text = await res.text();
        if (!res.ok) throw new Error('HTTP ' + res.status + ' : ' + text.slice(0, 120));
        let json;
        try { json = JSON.parse(text); } catch (e) { throw new Error('JSON invalide : ' + text.slice(0, 180)); }
        render(json);
      } catch (err) {
        el.stationName.textContent = 'Impossible de charger';
        setError('Vérifie que data.json existe à la racine et contient du JSON valide.');
        el.trainValue.textContent = '—';
        el.originValue.textContent = '—';
        el.destinationValue.textContent = '—';
        el.plannedValue.textContent = '—';
        el.estimatedValue.textContent = '—';
        el.trackValue.textContent = '—';
        el.updateValue.textContent = new Date().toLocaleString('fr-FR');
        el.debugBox.textContent = String(err && err.message ? err.message : err);
        el.app.classList.add('showdebug');
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadData);
    document.getElementById('copyBtn').addEventListener('click', async () => {
      if (!current) return;
      const text = Object.entries(current).map(([k,v]) => `${k}: ${v}`).join('
');
      try { await navigator.clipboard.writeText(text); document.getElementById('copyBtn').textContent = 'Copié !'; setTimeout(() => document.getElementById('copyBtn').textContent = 'Copier les infos', 1000); } catch(e) { alert('Copie impossible'); }
    });

    loadData();
    setInterval(loadData, 15000);
  </script>
</body>
</html>
